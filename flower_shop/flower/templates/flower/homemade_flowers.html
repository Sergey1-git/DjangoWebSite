{% extends 'base.html' %}
{% block content %}
<p>Домашние цветы</p>

<div class="cards">
    {% for p in posts %}
    {%if p.plant_type == 'home' %}
    <div class="card">
        <a href="{% url 'show_post' p.id %}"><img src="/media/{{p.photo}}" height="150" width="150"></a>
        <p>{{p.title }}  Цена {{p.price }}</p>
        <p>Доступно {{p.quantity}} шт.</p>
        <form  action="" method="post">{% csrf_token %}
            <input type="hidden" name='id' value={{p.id}}>
            <button type="submit" name="buy" value={{p.title}} > Купить </button>
        </form>
    </div>
    {% endif %}
    {% endfor %}
</div>
<nav class="pagination">
        <ul >
            {% for p in list_page %}
                <a href="?page={{ p }}" style="color:red">{{ p }}</a>
            {% endfor %}
        </ul>
</nav>
{% endblock %}
